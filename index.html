<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💝</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-background" id="heartsBackground"></div>

    <div class="container">
        <div class="question-screen" id="questionScreen">
            <div class="heart-icon">💖</div>
            <h1>Will you be my valentine my love?</h1>
            
            <div class="buttons-container" id="buttonsContainer">
                <button class="yes-btn" onclick="sayYes()">Yes! 💕</button>
                <button class="no-btn" id="noBtn" onclick="moveNoButton()">No</button>
            </div>
        </div>

        <div class="thank-you-screen" id="thankYouScreen">
            <div class="thank-you-message">
                <div class="heart-icon">💝</div>
                <div class="sparkles">✨ ✨ ✨</div>
                <h1>Yayyyy, thank you my love!</h1>
                <p>See you soonest, I love you always my loveee ❤️</p>
                <div class="sparkles">✨ ✨ ✨</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
